<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Administrador · Juega y Aprende</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Concepto: arena de preguntas flotando en un espacio 3D. Un cristal central reacciona a cada respuesta; la interfaz son paneles de vidrio que se inclinan con el cursor. Look único oscuro, elegido a propósito. */
:root{
  --bg:#050205; --bg2:#1a0614; --panel:rgba(26,8,20,.8); --panel2:rgba(46,12,34,.86);
  --line:rgba(255,79,163,.3); --ink:#fff0f7; --mute:#dba6c2;
  --acc:#ff4fa3; --ok:#6dffb0; --bad:#ff5d5d; --warn:#ffa6d2; --pink:#ff8cc6;
  --disp:'Unbounded',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
body.nogl{background:radial-gradient(900px 600px at 80% 20%,#5c0a3a 0,transparent 60%),radial-gradient(700px 500px at 10% 90%,#3a0830 0,transparent 60%),var(--bg)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;gap:20px;padding-block:18px 40px;pointer-events:none;max-width:1180px;margin:0 auto}
button,input,.panel,.qcard,.mode,.pcard,.chips,.stat{pointer-events:auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top-back{margin-right:0;border-color:var(--acc);box-shadow:0 0 18px color-mix(in srgb,var(--acc) 16%,transparent)}
.brand{order:0;margin-right:auto}
header.top .tools{margin-left:0}
@media(max-width:560px){.top-back{padding:8px 10px}.brand{font-size:13px}header.top{gap:8px}}
.brand{font:700 18px/1 var(--disp);letter-spacing:.04em;display:flex;align-items:center;gap:10px;margin:0}
.brand i{width:14px;height:14px;background:var(--acc);display:inline-block;transform:rotate(45deg);box-shadow:0 0 14px var(--acc);transition:background .4s,box-shadow .4s}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:relative}
.action-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;min-width:220px;padding:10px;display:grid;gap:8px;background:rgba(18,5,14,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px #0008;backdrop-filter:blur(18px)}
.action-menu[hidden]{display:none!important}
.action-menu .btn{text-align:left;width:100%}
.language-control{display:grid;gap:7px;padding:4px 2px;color:var(--mute);font-size:12px}.language-options{display:grid;grid-template-columns:1fr 1fr;gap:6px}.language-options .btn{font-size:12px;padding:8px 7px;text-align:center}.language-options .btn[aria-pressed="true"]{border-color:var(--acc);background:rgba(255,79,163,.2);color:var(--ink)}
.screen-back{display:inline-flex;align-items:center;gap:8px;margin-bottom:8px}
.screen-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:520px){.action-menu{right:0;max-width:calc(100vw - 32px)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--mute);backdrop-filter:blur(8px);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-family:var(--disp);font-weight:500;margin-left:6px}
.btn{font:600 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(8px);transition:border-color .2s,background .2s,transform .15s}
.btn:hover{border-color:var(--acc);background:var(--panel2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:#1a0010;border-color:var(--acc);font-weight:800}
.btn.primary:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
section{display:flex;flex-direction:column;gap:18px;max-width:660px;width:100%}
h1,h2{font-family:var(--disp);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(26px,5vw,40px)}
h2{font-size:clamp(20px,3.4vw,28px)}
.lead{color:var(--mute);margin:0;max-width:52ch}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 13px var(--body);color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;transition:all .2s}
.chip:hover{color:var(--ink);border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--acc);color:#1a0010;border-color:var(--acc);font-weight:800}
.label{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{--c:var(--acc);text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;color:var(--ink);font:inherit;backdrop-filter:blur(8px);transition:border-color .2s,box-shadow .25s,transform .12s;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode:hover{border-color:var(--c);box-shadow:0 0 26px -6px var(--c)}
.mode.wide{grid-column:1/-1}
.mode h3{font:500 15px var(--disp);margin:0;color:var(--c)}
.mode p{margin:0;font-size:13px;color:var(--mute)}
.mode small{font-size:12px;color:var(--ink);opacity:.8;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;backdrop-filter:blur(10px)}
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{flex:1;min-width:120px;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--acc),var(--pink));border-radius:99px;transition:width .15s linear}
.bar.low i{background:var(--bad)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);backdrop-filter:blur(12px);transition:transform .12s ease-out;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.qcard .cat{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:10px;display:block}
.qcard .q{font:700 clamp(18px,3.2vw,24px)/1.3 var(--disp);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.qcard .sub{margin:10px 0 0;color:var(--mute);font-size:14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:600 15px/1.3 var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;backdrop-filter:blur(8px);transition:transform .12s ease-out,border-color .2s,background .2s;min-width:0;overflow-wrap:anywhere}
.opt kbd{flex:none;font:500 12px var(--disp);width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.08);color:var(--mute)}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt.ok{background:rgba(109,255,176,.16);border-color:var(--ok)}
.opt.bad{background:rgba(255,93,93,.16);border-color:var(--bad);animation:shake .35s}
.opt.gone{opacity:.15;pointer-events:none}
.opt[disabled]{cursor:default}
.opt.vf{justify-content:center;font:700 18px var(--disp);padding:22px}
@keyframes shake{20%{transform:translateX(-8px)}50%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1;min-width:0}
input[type=text]{font:600 16px var(--body);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;min-width:0}
input[type=text]:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px rgba(255,79,163,.25)}
.fb{min-height:24px;font-weight:700;margin:0}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;perspective:1000px}
.pcard{position:relative;aspect-ratio:1/1.05;cursor:pointer;border:0;background:none;padding:0;color:inherit;font:inherit}
.pcard .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.pcard.flip .in{transform:rotateY(180deg)}
.pcard:hover:not(.flip) .in{transform:rotateY(-14deg) rotateX(8deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;padding:8px;text-align:center;border:1px solid var(--line)}
.face.back{background:linear-gradient(135deg,#3a0828,#b01f6a);font:700 26px var(--disp);color:rgba(255,255,255,.5)}
.face.front{transform:rotateY(180deg);background:var(--panel2);font:700 clamp(11px,1.7vw,15px)/1.25 var(--body);overflow-wrap:anywhere;hyphens:auto}
.pcard.done .face.front{background:rgba(109,255,176,.2);border-color:var(--ok)}
.pcard.no .face.front{border-color:var(--bad);background:rgba(255,93,93,.2)}
.big{font:700 clamp(40px,9vw,72px)/1 var(--disp);color:var(--acc);font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid3 .panel{text-align:center;padding:12px}
.grid3 b{display:block;font:500 22px var(--disp)}
.grid3 span{font-size:12px;color:var(--mute)}
.form{display:grid;gap:10px}
.form label{font-size:12px;color:var(--mute);display:grid;gap:4px}
.clist{display:grid;gap:8px;max-height:220px;overflow:auto}
.clist div{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05)}
.clist span{min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--acc);border-radius:12px;padding:10px 18px;font-weight:600;opacity:0;transition:all .3s;z-index:5;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.qtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.badge{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--mute);white-space:nowrap}
.badge.timed{color:var(--warn);border-color:var(--warn)}
.ctx{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ctx p{margin:0;max-width:62ch}
.ctx.good{border-color:var(--ok)}
.ctx.bad{border-color:var(--bad)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn.sm{padding:6px 12px;font-size:13px}
.mode{cursor:pointer}
.login-wrap{width:min(100%,520px);margin:auto;padding:clamp(22px,5vw,38px);background:var(--panel);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);box-shadow:0 24px 80px #0007}
.login-wrap .form{margin-top:20px}
.login-wrap input{font:600 16px var(--body);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;min-width:0}
.login-wrap label{font-size:12px;color:var(--mute);display:grid;gap:5px}
.subject-picks{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
.subject-pick{display:flex;align-items:center;gap:14px;text-align:left;padding:17px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--ink);cursor:pointer;font:inherit}
.subject-pick:hover{border-color:var(--acc);transform:translateY(-1px)}
.subject-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:#ffffff10;font-size:23px;flex:none}
.subject-pick strong{display:block;font-family:var(--disp);font-size:14px}
.subject-pick small{color:var(--mute);font-size:12px}
@media (min-width:520px){.subject-picks{grid-template-columns:repeat(3,minmax(0,1fr))}.subject-pick{align-items:flex-start;flex-direction:column}}
.mode small.saved{color:var(--ok);font-weight:700}
@media (max-width:560px){
  .opts,.modes{grid-template-columns:1fr}
  .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .brand{font-size:15px}
}

/* Temas por asignatura: todos en negro y rosado, con matices distintos. */
body.theme-mat{background:radial-gradient(900px 600px at 85% 8%,#5c0a3a 0,transparent 62%),radial-gradient(700px 500px at 8% 90%,#2e0620 0,transparent 60%),#050205}
body.theme-prog{background:radial-gradient(850px 600px at 85% 10%,#6a0a50 0,transparent 60%),radial-gradient(700px 500px at 8% 90%,#2a0630 0,transparent 60%),#050205}
body.theme-ing{background:radial-gradient(850px 600px at 85% 10%,#6a1038 0,transparent 60%),radial-gradient(700px 500px at 8% 90%,#38081e 0,transparent 60%),#070205}
body:after{content:'';position:fixed;z-index:0;pointer-events:none;right:-3vw;bottom:-6vh;width:min(42vw,520px);height:min(42vw,520px);border-radius:50%;opacity:.14;filter:blur(.2px);background:radial-gradient(circle at center,transparent 0 42%,var(--acc) 42.3% 42.7%,transparent 43%),radial-gradient(circle at center,transparent 0 58%,var(--acc) 58.2% 58.5%,transparent 58.8%)}
body.theme-mat:before,body.theme-prog:before,body.theme-ing:before{position:fixed;z-index:0;pointer-events:none;right:3vw;top:22vh;opacity:.09;font:700 clamp(28px,6vw,76px)/1.6 var(--disp);white-space:pre-wrap;max-width:40vw;text-align:right}
body.theme-mat:before{content:'∑  π  √\A x²  ∫  Δ'}
body.theme-prog:before{content:'{ }  </>\A 0101 1010'}
body.theme-ing:before{content:'A B C\A HELLO!'}
body.theme-mat #menu:before,body.theme-prog #menu:before,body.theme-ing #menu:before{display:block;white-space:pre-wrap;font:700 clamp(25px,5vw,42px)/1.25 var(--disp);letter-spacing:.06em;border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin-bottom:2px;box-shadow:inset 0 0 35px #ffffff08,0 14px 45px #0003}
body.theme-mat #menu:before{content:'∑   π   √   x²\A LABORATORIO DE MATEMÁTICAS';color:#ff8cc6;background:linear-gradient(120deg,#12030dee,#3a0a28dd);text-shadow:0 0 22px #ff4fa3}
body.theme-prog #menu:before{content:'{ }   </>   01\A LABORATORIO DE PROGRAMACIÓN';color:#ff6fb5;background:linear-gradient(120deg,#0c020aee,#42082fdd);text-shadow:0 0 22px #ff2d87}
body.theme-ing #menu:before{content:'A B C   ✦   Hello!\A LABORATORIO DE INGLÉS';color:#ffb3d9;background:linear-gradient(120deg,#10030aee,#3e0a26dd);text-shadow:0 0 22px #ff6fb5}
body.theme-mat .mode,body.theme-prog .mode,body.theme-ing .mode{background:linear-gradient(145deg,#2a0a1edd,#10030cdd)}
body.theme-prog .qcard,body.theme-prog .panel{border-radius:8px}
body.theme-ing .qcard,body.theme-ing .panel{border-radius:22px}
body.theme-mat .subject-icon,body.theme-prog .subject-icon,body.theme-ing .subject-icon{color:#ff8cc6;background:#ff4fa326}
body.theme-mat .login-wrap,body.theme-prog .login-wrap,body.theme-ing .login-wrap{background:linear-gradient(145deg,#12030dee,#2e0820ee);border-color:#ff4fa366}

/* Centrado general de toda la interfaz */
#app{align-items:center}
section{margin-inline:auto;align-items:stretch}
header.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;width:100%;gap:12px}
header.top .brand{margin:0 auto 0 0;text-align:left}
header.top .tools{justify-content:flex-end}
@media(max-width:820px){
  header.top{flex-direction:column;justify-content:center}
  header.top .brand{margin:0;justify-content:center;text-align:center}
  header.top .tools{justify-content:center}
  .action-menu{right:50%;transform:translateX(50%)}
}
#menu>div,#end h2,#login>div{text-align:center}
body #menu:before{text-align:center}
#menu .lead,#login .lead{margin-inline:auto}
.chips{justify-content:center}
.modes .mode{text-align:center;align-items:center}
.mrow{justify-content:center}
.screen-heading{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.screen-heading .screen-back{grid-column:1;justify-self:start;margin:0}
.screen-heading .label{grid-column:2;text-align:center}
.status{justify-content:center;text-align:center}
.row{justify-content:center}
.row .grow{flex:1 1 220px}
.qcard{text-align:center}
.qtop{justify-content:center;text-align:center}
.opt{justify-content:center;text-align:center}
.fb{text-align:center}
.ctx{align-items:center;text-align:center}
.ctx p{margin-inline:auto}
#pairs>.lead{text-align:center;margin-inline:auto}
.pgrid{justify-content:center}
.login-wrap{text-align:center}
.login-wrap label{text-align:left}
.login-wrap .subject-pick{align-items:center;text-align:center;justify-content:center}
.subject-pick span:last-child{text-align:center}
@media (min-width:520px){.login-wrap .subject-pick{flex-direction:column}}

/* Panel de administración */
#admin{max-width:1000px;pointer-events:auto;text-align:left}
#admin h2,#admin .a-h{text-align:left;margin:0}
#admin .a-h{font:700 16px var(--disp);color:var(--acc)}
#admin .lead{margin:0;max-width:none;text-align:left}
.a-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#aTabs{justify-content:flex-start}
.a-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;backdrop-filter:blur(10px);min-width:0}
.a-list{display:grid;gap:0}
.a-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.a-row small{color:var(--mute);overflow-wrap:anywhere;font-size:12px}
.a-row.changed small{color:var(--acc)}
.a-row.changed input{border-color:var(--acc)}
#admin input[type=text],#admin input[type=password],#admin textarea,#admin select{font:600 14px var(--body);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
#admin input[type=file]{font:600 13px var(--body);color:var(--mute);width:100%}
#admin textarea{min-height:68px;resize:vertical}
#admin select option,#admin select optgroup{background:#1a0614;color:#fff}
#admin input:focus,#admin textarea:focus,#admin select:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px rgba(255,79,163,.25)}
.a-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.a-bar>input,.a-bar>select{flex:1 1 220px;width:auto}
.a-note{color:var(--mute);font-size:12px}
.a-form{display:grid;gap:10px;padding:14px;border:1px dashed var(--acc);border-radius:12px;background:rgba(255,79,163,.06)}
.a-form label{display:grid;gap:5px;font-size:12px;color:var(--mute)}
.a-q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.a-q.del{opacity:.5}
.a-q b{overflow-wrap:anywhere;font-weight:700}
.a-q small{display:block;color:var(--mute);overflow-wrap:anywhere;margin-top:4px}
.a-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.a-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;padding:5px 0}
.a-pill{font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:2px 8px;margin-left:8px;white-space:nowrap}
@media(max-width:640px){.a-row,.a-pair,.a-q{grid-template-columns:minmax(0,1fr)}.a-btns{justify-content:flex-start}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[hidden]{display:none!important}
body.admin-page:before,body.admin-page:after{display:none}
#app{pointer-events:auto}
#gate .lead{margin-inline:auto}
</style></head>
<body class="admin-page">
<div id="app">
  <section id="gate" class="login-wrap">
    <div>
      <h1>Administrador</h1>
      <p class="lead" style="margin-top:12px">Acceso exclusivo del administrador.</p>
    </div>
    <form class="form" id="gateForm">
      <label>Usuario<input id="gateUser" type="text" placeholder="Usuario" autocomplete="username" required></label>

    <div>
      <h1>Contraseña nueva</h1>

</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)};
var norm=function(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').replace(/[.¿?¡!]+$/g,'').trim()};
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2600)}
var AREAS={mat:{name:'Laboratorio de Matemáticas'},prog:{name:'Laboratorio de Programación'},ing:{name:'Laboratorio de Inglés'}};
function applyBankOverrides(){}function applyBanners(){}function applyLanguage(){}function renderMenu(){}
/* Textos editables: solo las partes escritas (no botones ni preguntas). */
var KEYS=["Juega y Aprende", "Inicia sesión para entrar a tu espacio de estudio.", "Usuario", "Contraseña", "Demo local: puedes escribir cualquier usuario y contraseña. No se envían a ningún servidor.", "¿Qué quieres estudiar?", "Cada área tiene su propia pantalla y sus propios retos.", "Puntos", "Racha", "Nivel", "Vidas", "Idioma / Language", "Laboratorio de Matemáticas", "Categoría", "Modo de juego", "Clásico", "Hasta 20 preguntas de opción múltiple. Algunas llevan reloj y otras no.", "Sin récord todavía", "Verdadero o falso", "Hasta 20 afirmaciones. Algunas llevan reloj y otras no.", "Contrarreloj", "60 segundos. Acertar suma 2 s, fallar resta 5 s.", "Supervivencia", "Tres vidas, sin fin. Algunas preguntas llevan reloj.", "Relámpago", "Hasta 15 preguntas de 8 segundos cada una, más puntos si respondes rápido.", "Escribir", "10 preguntas sin opciones: escribe la respuesta. Hay pista y algunas llevan reloj.", "Parejas 3D", "Voltea cartas y une cada término con su significado.", "Sesión de práctica", "Pregunta", "Punto de control", "Reto de parejas", "Movimientos", "Parejas", "Voltea dos cartas. Une cada término con su significado.", "Resumen de partida", "Resultado", "Puntaje final", "Aciertos", "Mejor racha", "Tiempo", "Escribe tu usuario", "Escribe tu contraseña", "Inglés básico", "Laboratorio de Programación", "Laboratorio de Inglés", "Álgebra, cálculo y estadística", "Lógica, código y algoritmos", "Vocabulario y gramática básica", "preguntas en esta categoría", "Escribe tu respuesta", "Libre", "Reloj global", "Sin límite de tiempo", "Escribe la respuesta y presiona Enter.", "Contexto · ¡acertaste!", "Contexto · para repasar", "Nivel maestro", "Muy buen resultado", "Vas por buen camino", "A seguir practicando", "Elige tu área de estudio", "¡Bienvenido de nuevo!", "Escribe tu usuario para continuar.", "No hay suficientes preguntas para este modo.", "Escribe algo primero.", "Avance guardado. Puedes continuar desde el menú.", "Este modo usa las categorías con parejas. Elige otra.", "Ranking global", "Los mejores puntajes", "Cargando ranking…", "Aún no hay puntajes en este modo. ¡Sé el primero!", "No se pudo cargar el ranking. Revisa tu conexión.", "El ranking global todavía no está activado.", "Enviando tu puntaje al ranking global…", "Puntaje enviado al ranking global.", "No se pudo enviar el puntaje al ranking."];
function uiKeys(){return KEYS.slice()}
var ADM_KEY='q3d_admin';
function admLoad(){try{var v=JSON.parse(localStorage.getItem(ADM_KEY)||'{}');return(v&&typeof v==='object'&&!Array.isArray(v))?v:{}}catch(e){return {}}}
var ADM=admLoad();
function admNormalize(){['ui','msg','banner','intro','qs','pairs'].forEach(function(k){if(!ADM[k]||typeof ADM[k]!=='object'||Array.isArray(ADM[k]))ADM[k]={}});ADM.qs={};ADM.pairs={}}
admNormalize();
function admSave(){try{localStorage.setItem(ADM_KEY,JSON.stringify(ADM));return true}catch(e){return false}}
function ov(s){var v=ADM.ui[s];return(typeof v==='string'&&v!=='')?v:s}
/* Mensajes con datos variables: {n}, {a}, etc. se reemplazan al mostrarlos. */
var MSG_DEFAULT={
  correct:'¡Correcto! +{p}',
  streak:'  ·  racha de {n}',
  timeout:'Se acabó el tiempo. ',
  answer:'Respuesta: {a}',
  ctxFallback:'La respuesta correcta es: {a}.',
  vfSub:'Afirmación: «{t}». ¿Es correcta?',
  vfTrue:'La afirmación era verdadera: {a}',
  vfFalse:'Era falsa. Lo correcto: {a}',
  timed:'Con tiempo · {n} s',
  hint:'Empieza con «{c}» y tiene {n} caracteres',
  fifty:'Comodín 50/50 ×{n}',
  checkpoint:'Llevas {t} preguntas, {ok} correctas y {s} puntos. Puedes seguir o dejarlo aquí: tu avance queda guardado en este modo y lo retomas desde el menú.',
  newRecord:'Nuevo récord en {m}',
  yourRecord:'Tu récord: {n} pts',
  record:'Récord: {n} pts',
  pairsOk:'{n} pares',
  savedQ:'Partida guardada · pregunta {n} · {s} pts',
  savedPairs:'Partida guardada · {f} de 6 parejas · {m} movimientos',
  resumeQ:'Partida retomada en la pregunta {n}.',
  resumePairs:'Partida retomada: {n} de 6 parejas.',
  evolve:'¡Evolución 3D desbloqueada! Nivel {n}',
  qCount:'{n} preguntas en esta categoría',
  hello:'¡Hola, {u}!'
};
var MSG_LABEL={
  correct:'Al acertar · {p} = puntos ganados',
  streak:'Se agrega al acertar con racha · {n} = racha',
  timeout:'Antes de la respuesta cuando se acaba el tiempo',
  answer:'Al fallar · {a} = respuesta correcta',
  ctxFallback:'Explicación cuando la pregunta no tiene una · {a} = respuesta',
  vfSub:'Pregunta de verdadero o falso · {t} = afirmación',
  vfTrue:'Verdadero o falso (era verdadera) · {a} = respuesta',
  vfFalse:'Verdadero o falso (era falsa) · {a} = respuesta',
  timed:'Etiqueta de pregunta con reloj · {n} = segundos',
  hint:'Pista en el modo Escribir · {c} = primera letra, {n} = largo',
  fifty:'Botón del comodín · {n} = comodines restantes',
  checkpoint:'Punto de control · {t} preguntas, {ok} aciertos, {s} puntos',
  newRecord:'Resumen final con récord nuevo · {m} = modo',
  yourRecord:'Resumen final sin récord nuevo · {n} = récord',
  record:'Récord en la tarjeta del modo · {n} = puntos',
  pairsOk:'Resumen de parejas · {n} = parejas',
  savedQ:'Partida guardada · {n} = pregunta, {s} = puntos',
  savedPairs:'Partida guardada de parejas · {f} = parejas, {m} = movimientos',
  resumeQ:'Aviso al continuar una partida · {n} = pregunta',
  resumePairs:'Aviso al continuar parejas · {n} = parejas halladas',
  evolve:'Aviso al evolucionar la figura 3D · {n} = nivel',
  qCount:'Cantidad de preguntas de la categoría · {n} = cantidad',
  hello:'Saludo al iniciar sesión · {u} = usuario'
};
function tm(k,v){var t=(typeof ADM.msg[k]==='string'&&ADM.msg[k]!=='')?ADM.msg[k]:MSG_DEFAULT[k];return String(t).replace(/\{(\w+)\}/g,function(m,n){return(v&&v[n]!=null)?v[n]:m})}
var BANNER_DEF={mat:{sym:'∑   π   √   x²',title:'LABORATORIO DE MATEMÁTICAS'},prog:{sym:'{ }   </>   01',title:'LABORATORIO DE PROGRAMACIÓN'},ing:{sym:'A B C   ✦   Hello!',title:'LABORATORIO DE INGLÉS'}};
var AREA_INTRO={mat:'Resuelve retos de álgebra, cálculo y estadística.',prog:'Practica lógica, pseudocódigo, Python, C++, HTML y JavaScript.',ing:'Aprende vocabulario, gramática y expresiones en inglés básico.'};
var INTRO_TAIL=' Cada área tiene más de 1.000 preguntas disponibles; la figura 3D evoluciona cada 5 niveles.';
function introDefault(a){return AREA_INTRO[a]+INTRO_TAIL}
function introText(a){var v=ADM.intro[a];return(typeof v==='string'&&v!=='')?v:introDefault(a)}
var ADM_TABS=[['ui','Textos'],['msg','Mensajes'],['cov','Portadas'],['bak','Respaldo']];
var aTab='ui',aSt={cat:'alg',q:'',page:0,edit:null,filter:'all',ui:'',pcat:'alg',prow:null,prowCat:null};
function adh(tag,props,kids){
  var e=document.createElement(tag);
  if(props)for(var k in props){
    var v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='value')e.value=v;else if(k.slice(0,2)==='on')e[k]=v;else e.setAttribute(k,v===true?'':v);
  }
  (kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});
  return e;
}
function abtn(t,f,cls){var b=adh('button',{type:'button',class:'btn sm'+(cls?' '+cls:''),text:t});b.onclick=f;return b}
function aSaveWarn(){if(!admSave())toast('No se pudo guardar: el navegador bloqueó el almacenamiento.')}
function aApplyAll(){applyBankOverrides();applyBanners();applyLanguage();try{renderMenu()}catch(e){}}

function renderAdmin(){
  var tabs=$('#aTabs');tabs.innerHTML='';
  ADM_TABS.forEach(function(t){
    var b=adh('button',{type:'button',class:'chip','aria-pressed':String(aTab===t[0]),text:t[1]});
    b.onclick=function(){aTab=t[0];aSt.edit=null;renderAdmin()};
    tabs.appendChild(b);
  });
  var body=$('#aBody');body.innerHTML='';
  ({ui:aRenderUI,msg:aRenderMsg,cov:aRenderCov,bak:aRenderBak})[aTab](body);
}

/* ----- Pestaña: textos de la interfaz ----- */
function aRenderUI(body){
  var keys=uiKeys(),s=adh('input',{type:'text',placeholder:'Buscar un texto…','aria-label':'Buscar un texto'}),cnt=adh('small',{class:'a-note'});
  s.value=aSt.ui;
  var list=adh('div',{class:'a-list'});
  body.append(
    adh('p',{class:'lead',text:'Aquí aparecen los textos escritos del juego: títulos, descripciones, instrucciones y avisos. Los botones y las preguntas no se editan desde este panel. Escribe el texto nuevo a la derecha; se guarda al salir del campo. El botón ↺ devuelve el original.'}),
    adh('div',{class:'a-bar'},[s,cnt]),list
  );
  function draw(){
    list.innerHTML='';aSt.ui=s.value;
    var q=norm(s.value),n=0;
    keys.forEach(function(k){
      var cur=ADM.ui[k]!==undefined?ADM.ui[k]:k;
      if(q&&norm(k+' '+cur).indexOf(q)<0)return;
      n++;
      var inp=adh('input',{type:'text','aria-label':'Texto nuevo para: '+k});inp.value=cur;
      var rb=adh('button',{type:'button',class:'btn sm',title:'Restaurar el original','aria-label':'Restaurar el original',text:'↺'});
      var row=adh('div',{class:'a-row'+(ADM.ui[k]!==undefined?' changed':'')},[adh('small',{text:k}),inp,rb]);
      inp.onchange=function(){
        var v=inp.value;
        if(v.trim()===''||v===k){delete ADM.ui[k];inp.value=k}else ADM.ui[k]=v;
        row.classList.toggle('changed',ADM.ui[k]!==undefined);
        aSaveWarn();applyLanguage();
      };
      rb.onclick=function(){delete ADM.ui[k];inp.value=k;row.classList.remove('changed');aSaveWarn();applyLanguage()};
      list.appendChild(row);
    });
    cnt.textContent=n+' textos';
  }
  s.oninput=draw;draw();
}

/* ----- Pestaña: mensajes con datos variables ----- */
function aRenderMsg(body){
  body.appendChild(adh('p',{class:'lead',text:'Mensajes que cambian según la partida. Conserva las palabras entre llaves, como {n}: el juego las reemplaza por el dato real.'}));
  var list=adh('div',{class:'a-list'});body.appendChild(list);
  Object.keys(MSG_DEFAULT).forEach(function(k){
    var inp=adh('input',{type:'text','aria-label':MSG_LABEL[k]});
    inp.value=(typeof ADM.msg[k]==='string'&&ADM.msg[k]!=='')?ADM.msg[k]:MSG_DEFAULT[k];
    var rb=adh('button',{type:'button',class:'btn sm',title:'Restaurar el original','aria-label':'Restaurar el original',text:'↺'});
    var row=adh('div',{class:'a-row'+(ADM.msg[k]!==undefined?' changed':'')},[adh('small',{text:MSG_LABEL[k]}),inp,rb]);
    inp.onchange=function(){
      var v=inp.value;
      if(v===''||v===MSG_DEFAULT[k]){delete ADM.msg[k];inp.value=MSG_DEFAULT[k]}else ADM.msg[k]=v;
      row.classList.toggle('changed',ADM.msg[k]!==undefined);aSaveWarn();
    };
    rb.onclick=function(){delete ADM.msg[k];inp.value=MSG_DEFAULT[k];row.classList.remove('changed');aSaveWarn()};
    list.appendChild(row);
  });
}

/* ----- Pestaña: portadas y presentaciones de cada laboratorio ----- */
function aRenderCov(body){
  body.appendChild(adh('p',{class:'lead',text:'Edita el cuadro grande de cada laboratorio y el texto de presentación. El nombre del laboratorio (el título blanco) se cambia en la pestaña Textos.'}));
  ['mat','prog','ing'].forEach(function(a){
    var d=BANNER_DEF[a],b=ADM.banner[a]||{};
    var sym=adh('input',{type:'text'}),ti=adh('input',{type:'text'}),intro=adh('textarea');
    sym.value=(typeof b.sym==='string'&&b.sym!=='')?b.sym:d.sym;
    ti.value=(typeof b.title==='string'&&b.title!=='')?b.title:d.title;
    intro.value=introText(a);
    function save(){
      var o={};
      if(sym.value!==''&&sym.value!==d.sym)o.sym=sym.value;
      if(ti.value!==''&&ti.value!==d.title)o.title=ti.value;
      if(o.sym!==undefined||o.title!==undefined)ADM.banner[a]=o;else delete ADM.banner[a];
      var iv=intro.value;
      if(iv===''||iv===introDefault(a))delete ADM.intro[a];else ADM.intro[a]=iv;
      aSaveWarn();applyBanners();try{renderMenu()}catch(e){}
    }
    sym.onchange=ti.onchange=intro.onchange=save;
    body.appendChild(adh('div',{class:'a-form'},[
      adh('h3',{class:'a-h',text:AREAS[a].name}),
      adh('label',{},['Símbolos del cuadro grande',sym]),
      adh('label',{},['Título del cuadro grande',ti]),
      adh('label',{},['Texto de presentación',intro]),
      abtn('Restaurar esta portada',function(){delete ADM.banner[a];delete ADM.intro[a];aSaveWarn();applyBanners();try{renderMenu()}catch(e){}renderAdmin()})
    ]));
  });
}

function aCount(){
  var q=0;
  return {ui:Object.keys(ADM.ui).length,msg:Object.keys(ADM.msg).length,q:q,p:Object.keys(ADM.pairs).length,b:Object.keys(ADM.banner).length+Object.keys(ADM.intro).length};
}
function aRenderBak(body){
  var c=aCount();
  var file=adh('input',{type:'file',accept:'application/json,.json','aria-label':'Archivo de cambios'});
  body.append(
    adh('div',{class:'a-form'},[
      adh('h3',{class:'a-h',text:'Cambios guardados'}),
      adh('p',{class:'lead',text:c.ui+' textos, '+c.msg+' mensajes y '+c.b+' cambios en portadas.'}),
      adh('p',{class:'lead',text:'Los cambios se guardan solo en este navegador de este dispositivo. Para usarlos en otro, descarga el archivo y cárgalo allá.'}),
      adh('div',{class:'a-bar'},[
        abtn('Descargar copia de seguridad',function(){
          var blob=new Blob([JSON.stringify(ADM,null,2)],{type:'application/json'}),a=document.createElement('a');
          a.href=URL.createObjectURL(blob);a.download='juega-y-aprende-cambios.json';document.body.appendChild(a);a.click();a.remove();
          setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
        },'primary'),
        abtn('Borrar todos los cambios',function(){
          if(!confirm('¿Borrar TODOS los cambios y volver a los textos originales?'))return;
          ADM={};admNormalize();aSaveWarn();aSt.prow=null;aApplyAll();renderAdmin();toast('Se restauraron los textos originales.');
        })
      ])
    ]),
    adh('div',{class:'a-form'},[
      adh('h3',{class:'a-h',text:'Cargar una copia de seguridad'}),
      adh('label',{},['Archivo .json descargado antes (reemplaza los cambios actuales)',file])
    ])
  );
  file.onchange=function(){
    var f=file.files&&file.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var v=JSON.parse(String(r.result));
        if(!v||typeof v!=='object'||Array.isArray(v))throw new Error('formato');
        ADM=v;admNormalize();aSaveWarn();aSt.prow=null;aApplyAll();renderAdmin();toast('Cambios cargados.');
      }catch(e){toast('El archivo no es una copia de seguridad válida.')}
    };
    r.readAsText(f);
  };
}


/* ---------- ENTRADA (la contraseña se verifica en el servidor) ---------- */
function api(body){
  return fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(d){return {status:r.status,data:d}})});
}
function netErr(){toast('No se pudo conectar con el servidor. Abre el sitio publicado en Netlify.')}
var resetToken=(location.hash.match(/^#reset=([A-Za-z0-9_-]+)$/)||[])[1]||'';
if(resetToken){$('#gate').hidden=true;$('#reset').hidden=false}
$('#gateForm').addEventListener('submit',function(e){
  e.preventDefault();
  var b=$('#gateGo');b.disabled=true;
  api({action:'login',user:$('#gateUser').value,pass:$('#gatePass').value}).then(function(r){
    if(r.status===200){$('#gate').hidden=true;$('#admin').hidden=false;aTab='ui';renderAdmin();return}
    $('#gatePass').value='';
    if(r.status===429)toast('Demasiados intentos. Espera unos minutos.');
    else if(r.status===401)toast('Usuario o contraseña incorrectos.');
    else netErr();
  }).catch(netErr).then(function(){b.disabled=false});
});
$('#forgotBtn').addEventListener('click',function(){
  var b=this;b.disabled=true;
  api({action:'forgot'}).then(function(r){
    if(r.status===200)toast('Listo. Te enviamos un enlace al correo del administrador (revisa también spam). Vence en 15 minutos.');
    else if(r.status===503)toast('El envío de correo todavía no está configurado en Netlify.');
    else toast('No se pudo enviar el correo. Intenta de nuevo.');
  }).catch(netErr).then(function(){setTimeout(function(){b.disabled=false},3000)});
});
$('#resetForm').addEventListener('submit',function(e){
  e.preventDefault();
  var p1=$('#resPass').value;
  if(p1!==$('#resPass2').value){toast('Las contraseñas no coinciden.');return}
  if(p1.length<8){toast('La contraseña debe tener al menos 8 caracteres.');return}
  var b=$('#resGo');b.disabled=true;
  api({action:'reset',token:resetToken,user:$('#resUser').value,pass:p1}).then(function(r){
    if(r.status===200){
      toast('Contraseña guardada. Ya puedes entrar.');
      resetToken='';history.replaceState(null,'',location.pathname);
      $('#resPass').value=$('#resPass2').value='';
      $('#reset').hidden=true;$('#gate').hidden=false;$('#gateUser').value=$('#resUser').value;
    }else if(r.status===410)toast('El enlace no es válido o ya venció. Pide uno nuevo.');
    else if(r.status===429)toast('Demasiados intentos. Espera unos minutos.');
    else toast((r.data&&r.data.error)||'No se pudo guardar la contraseña.');
  }).catch(netErr).then(function(){b.disabled=false});
});
})();
</script>
